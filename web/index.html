<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vectes — market data for 24 assets and a personal trading journal synced from MetaTrader 4, built on an end-to-end data pipeline." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet" />
    <title>Vectes — Market Data &amp; Trading Journal</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash
      try {
        const t = localStorage.getItem('vectes-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
