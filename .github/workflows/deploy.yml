name: Refresh data & deploy Vectes

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/functions/_shared/**'
      - 'scripts/**'
      - 'data/pipeline/**'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '30 22 * * *'   # daily, after the US market close
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Extract + transform: market history -> web/public/data ──
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Extract one year of market history
        run: python scripts/extract_history.py
      - name: Build website datasets
        run: python scripts/build_web_data.py

      # ── Build the site ──
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
